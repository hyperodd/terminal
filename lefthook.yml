# Pre-commit hooks
pre-commit:
  commands:
    biome:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx biome check --write --staged --no-errors-on-unmatched && git add {staged_files}
    lingui-extract:
      glob: "src/**/*.{ts,tsx}"
      run: bash -c '. "$NVM_DIR/nvm.sh" && npx lingui extract' && git add src/locales/**/*.po

# Commit message validation
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
